<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#1a1a2e" stroke="#e94560" stroke-width="3"/>

  <!-- Pager body -->
  <rect x="30" y="38" width="68" height="52" rx="8" ry="8" fill="#2d2d4e" stroke="#e94560" stroke-width="2.5"/>

  <!-- Pager screen -->
  <rect x="38" y="46" width="40" height="20" rx="3" ry="3" fill="#0f3460"/>

  <!-- Screen text lines -->
  <line x1="42" y1="53" x2="62" y2="53" stroke="#e94560" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="42" y1="59" x2="55" y2="59" stroke="#e94560" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Pager button -->
  <circle cx="86" cy="56" r="5" fill="#e94560" opacity="0.8"/>

  <!-- Bottom speaker grille -->
  <line x1="42" y1="76" x2="48" y2="76" stroke="#4a4a6a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="76" x2="58" y2="76" stroke="#4a4a6a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="76" x2="68" y2="76" stroke="#4a4a6a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72" y1="76" x2="78" y2="76" stroke="#4a4a6a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Alert notification dot -->
  <circle cx="92" cy="38" r="8" fill="#f5c518"/>
</svg>
